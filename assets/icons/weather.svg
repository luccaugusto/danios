<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Weather cloud (clima), centered in a 64x64 viewBox, transparent
    background. Geometry: a flat-bottomed base (rounded rect 10..54 x 35..49,
    rx=7) with three puffs on top — left circle (22,35) r=11, big middle
    circle (33,29) r=12, right circle (43,36) r=9. All primitives share one
    opaque fill, so their union renders seamlessly. No strokes, no gradients,
    no text.

    Fill is the settings gear's #5A7DA0 hue-rotated to teal (#5AA0A0) —
    same saturation/lightness so the icon set stays one family while apps
    remain tellable apart at 64 px (settings=blue-grey, calc=green,
    weather=teal). See assets/icons/svg_to_lvgl_bin.py for the
    SVG -> LVGL .bin conversion pipeline.
  -->
  <g fill="#5AA0A0">
    <rect x="10" y="35" width="44" height="14" rx="7" />
    <circle cx="22" cy="35" r="11" />
    <circle cx="33" cy="29" r="12" />
    <circle cx="43" cy="36" r="9" />
  </g>
</svg>
