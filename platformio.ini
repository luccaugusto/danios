; danios — ESP32-2432S024 ("Cheap Yellow Display", 2.4" resistive XPT2046)
; See docs/superpowers/specs/2026-06-03-esp32-gift-device-design.md for the design
; and docs/superpowers/plans/2026-07-03-danios-roadmap.md for the plan contract.

[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32@7.0.1
board = esp32dev            ; ESP32-WROOM-32 (what the S024 is built on)
framework = arduino
test_ignore = *             ; tests are host-only — run them with `pio test -e native`
monitor_speed = 115200
upload_speed = 460800       ; safe for the CH340; bump to 921600 later if reliable
board_build.partitions = huge_app.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -Iinclude
build_src_filter = +<*>
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    lvgl/lvgl@8.4.0
    ; F5: A2DP source. Plan pinned v1.8.11, but that release predates the IDF-5.2
    ; enum fix (ESP_A2D_AUDIO_STATE_SUSPEND) and fails to compile on our
    ; arduino-esp32 3.x / IDF 5.x platform. The fix is only on main (unreleased),
    ; so pin the exact SHA for reproducibility (F5 Task 0 spike).
    https://github.com/pschatzmann/ESP32-A2DP.git#b559fb15bc01709e7f423adc362355a310eb7287

; Host-side unit tests (Unity). Builds only lib/ + test/ — pure std-C++ logic,
; zero Arduino/LVGL includes allowed in anything this env compiles.
[env:native]
platform = native
test_build_src = false
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
